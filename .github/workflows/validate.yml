name: Validate ESPHome Configs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dummy secrets.yaml for validation
        run: |
          cat <<EOF > secrets.yaml
          wifi_ssid: "Dummy_SSID"
          wifi_password: "Dummy_Password"
          api_key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="  # valid base64 32-byte dummy (all-zeros is rejected)
          ota_password: "Dummy_OTA_Password"
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-state-key: 'esphome-validation'

      - name: Install ESPHome
        run: pip install esphome

      - name: Validate Configurations
        run: |
          set -e
          for f in ac-*.yaml; do
            echo "Validating $f..."
            esphome config "$f"
          done
