# ==============================================================================
# SMLIGHT SLWF-01 Pro - Pro Edition (Base Package)
# Optimized for ESP8266 & Innovair (Midea Protocol) Mini-Splits
# ==============================================================================

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: "SMLIGHT.SLWF-01Pro-Pro"
    version: "1.0.0"

  platformio_options:
    board_build.flash_mode: dout

esp8266:
  board: esp12e

# --- FLASH WEAR & PERFORMANCE ---
preferences:
  flash_write_interval: 5min

logger:
  baud_rate: 0
  level: WARN

# --- NETWORKING & SECURITY ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 10min
  ap:
    ssid: "${friendly_name} Fallback"
    password: "slwf01pro"
  # Proactive AP roaming settings:
  # Disconnects from a weak AP if RSSI drops below -80dBm for more than 10s
  output_power: 17.5dBm # Prevents the small ESP module from screaming too loud

captive_portal:

web_server:
  port: 80

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# --- HARDWARE UART MAPPING ---
# Verified GPIOs for v2.4 board revision
uart:
  tx_pin: GPIO12
  rx_pin: GPIO14
  baud_rate: 9600

# --- IR TRANSMITTER (SMLIGHT v2 Dongle Hook) ---
remote_transmitter:
  pin: GPIO13
  carrier_duty_percent: 100%

# --- MIDEA CLIMATE CONTROLLER ---
climate:
  - platform: midea
    name: "${friendly_name}"
    id: midea_climate
    period: 2s # Reduced UART traffic (optimized from stock 1s)
    timeout: 2s
    num_attempts: 3
    autoconf: true
    beeper: false # Default to false; controlled dynamically by switch instead
    visual:
      min_temperature: "17 °C"
      max_temperature: "30 °C"
      temperature_step: "1.0 °C"
    supported_modes:
      - FAN_ONLY
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
    custom_fan_modes:
      - SILENT
      - TURBO
    supported_presets:
      - ECO
      - BOOST
      - SLEEP
    custom_presets:
      - FREEZE_PROTECTION
    supported_swing_modes:
      - VERTICAL
      - HORIZONTAL
      - BOTH
    outdoor_temperature:
      name: "${friendly_name} Outdoor Temperature"
    power_usage:
      name: "${friendly_name} Power Usage"
    humidity_setpoint:
      name: "${friendly_name} Indoor Humidity"

# --- INTERACTIVE CONTROLS ---
button:
  - platform: restart
    name: "${friendly_name} Restart"
    entity_category: diagnostic

  - platform: safe_mode
    name: "${friendly_name} Safe Mode"
    entity_category: diagnostic

  - platform: factory_reset
    id: factory_reset_btn
    name: "${friendly_name} Factory Reset"
    entity_category: diagnostic

  - platform: template
    name: "${friendly_name} Display Toggle"
    id: midea_display_toggle
    icon: mdi:theme-light-dark
    on_press:
      midea_ac.display_toggle:

  - platform: template
    name: "${friendly_name} Swing Step"
    id: midea_swing_step
    icon: mdi:tailwind
    on_press:
      midea_ac.swing_step:

# --- SWITCHES ---
switch:
  - platform: template
    name: "${friendly_name} Beeper"
    id: midea_beeper
    icon: mdi:volume-source
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      midea_ac.beeper_on:
    turn_off_action:
      midea_ac.beeper_off:

# --- OPTIMIZED HOME ASSISTANT FOLLOW ME SENSOR ---
sensor:
  - platform: homeassistant
    entity_id: "${follow_me_sensor}"
    id: follow_me_temp
    filters:
      - throttle: 15s
      - heartbeat: 5min # Less network chatter
      - debounce: 1s
      - delta: 0.2 # Only update on meaningful temperature shifts
    on_value:
      midea_ac.follow_me:
        temperature: !lambda "return x;"
        beeper: false

# --- EXTENSIVE DIAGNOSTICS ---
  - platform: wifi_signal
    name: "${friendly_name} Wi-Fi Signal"
    id: wifi_sig
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "${friendly_name} Uptime"
    id: uptime_sec
    update_interval: 60s
    entity_category: diagnostic

  # Expose system heap to monitor RAM health
  - platform: template
    name: "${friendly_name} Free Heap"
    lambda: |-
      return ESP.getFreeHeap();
    unit_of_measurement: bytes
    icon: mdi:memory
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} Connected SSID"
    bssid:
      name: "${friendly_name} Access Point BSSID"
    mac_address:
      name: "${friendly_name} MAC Address"

dashboard_import:
  package_import_url: github://dwightmulcahy/slwf01pro-pro-firmware/packages/slwf-base.yaml
  import_full_config: false